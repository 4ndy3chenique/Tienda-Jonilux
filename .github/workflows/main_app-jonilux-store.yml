# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy PHP app to Azure Web App - app-jonilux-store

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

# Evita despliegues solapados y que un push cancele uno en curso
concurrency:
  group: deploy-app-jonilux-store
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@v1
        with:
          files: 'composer.json'

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress


      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F5219EC71E0445A79D562DD384CB575D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F73A8D95C18B4089BB2A7CC020C53BED }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A3F4E39DF4944265B09B120D1C4AA73F }}

      - name: Configurar variables de entorno
        run: |
          az webapp config appsettings set --name app-jonilux-store --resource-group tienda-jonilux --settings \
            DB_NAME=tienda_wp \
            DB_USER=JONILUX \
            DB_PASSWORD=${{ secrets.AZURE_DB_PASSWORD }} \
            DB_HOST=mysql-jonilux-db.mysql.database.azure.com:3306 \
            WP_HOME=https://app-jonilux-store-ddhpbxfdd5a4g6ff.brazilsouth-01.azurewebsites.net \
            WP_SITEURL=https://app-jonilux-store-ddhpbxfdd5a4g6ff.brazilsouth-01.azurewebsites.net \
            MYSQL_SSL_CA=/home/site/wwwroot/bin/DigiCertGlobalRootG2.crt.pem \
            WEBSITES_PHP_VERSION=8.5 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=true

      - name: Detener App Service
        if: ${{ env.AZURE_RESOURCE_GROUP != '' }}
        run: az webapp stop --name app-jonilux-store --resource-group "$AZURE_RESOURCE_GROUP"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'app-jonilux-store'
          slot-name: 'Production'
          package: .
          clean: true
          restart: true
          startup-command: '/home/site/wwwroot/startup.sh'
          resource-group-name: ${{ secrets.AZURE_RESOURCE_GROUP }}

      - name: Arrancar App Service
        if: ${{ env.AZURE_RESOURCE_GROUP != '' }}
        run: az webapp start --name app-jonilux-store --resource-group "$AZURE_RESOURCE_GROUP"
